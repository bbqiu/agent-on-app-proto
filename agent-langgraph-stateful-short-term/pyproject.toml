[project]
name = "agent-server"
version = "0.1.0"
description = "MLflow-compatible agent server with FastAPI"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.2",
    # Install both databricks_mcp and databricks-langchain from the dev branch
    # to ensure workspace_client attribute is available in DatabricksOAuthClientProvider
    # or else we get if isinstance(auth, DatabricksOAuthClientProvider) and auth.workspace_client is not None:
    # AttributeError: 'DatabricksOAuthClientProvider' object has no attribute 'workspace_client'
    "databricks_mcp @ git+https://github.com/databricks/databricks-ai-bridge@async-checkpointsaver#subdirectory=databricks_mcp",
    "databricks-langchain[memory] @ git+https://github.com/databricks/databricks-ai-bridge@async-checkpointsaver#subdirectory=integrations/langchain",
    "mlflow>=3.8.0rc0",
    "langgraph>=1.0.1",
    "langchain-mcp-adapters>=0.1.11",
    "python-dotenv",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Note: Required for direct git references (depends on async checkpoint saver ). Delete when official databricks-langchain[memory] release is available
allow-direct-references = true

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "pytest>=7.0.0",
]


[project.scripts]
start-server = "agent_server.start_server:main"
agent-evaluate = "agent_server.evaluate_agent:evaluate"
